interface:
  display_name: "SparkLaunch Platform"
  short_description: "Route founder work from idea through launch"
  icon_small: "./assets/sparklaunch-small.svg"
  icon_large: "./assets/sparklaunch.png"
  brand_color: "#6366F1"
  default_prompt: "Use $sparklaunch-platform to choose and run the right connected SparkLaunch founder workflow."
dependencies:
  tools:
    - type: "mcp"
      value: "sparklaunch"
      description: "Connected SparkLaunch project, validation, brand, launch, campaign, and CRM tools"
      transport: "streamable_http"
      url: "https://sparklaun.ch/api/mcp/"
policy:
  allow_implicit_invocation: true
