interface:
  display_name: "SparkLaunch Landing Pages"
  short_description: "Create, publish, and measure landing pages"
  icon_small: "./assets/sparklaunch-small.svg"
  icon_large: "./assets/sparklaunch.png"
  brand_color: "#6366F1"
  default_prompt: "Use $sparklaunch-landing-pages to create a measurable landing page for my connected project."
dependencies:
  tools:
    - type: "mcp"
      value: "sparklaunch"
      description: "Connected SparkLaunch landing page tools"
      transport: "streamable_http"
      url: "https://sparklaun.ch/api/mcp/"
policy:
  allow_implicit_invocation: true
