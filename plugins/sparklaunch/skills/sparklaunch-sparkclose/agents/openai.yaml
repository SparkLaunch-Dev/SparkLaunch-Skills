interface:
  display_name: "SparkLaunch SparkClose"
  short_description: "Model SAFEs and manage confirmed investment closings"
  icon_small: "./assets/sparklaunch-small.png"
  icon_large: "./assets/sparklaunch.png"
  brand_color: "#6366F1"
  default_prompt: "Use $sparklaunch-sparkclose to model a SAFE and review the steps to close its investment."
dependencies:
  tools:
    - type: "mcp"
      value: "sparklaunch"
      description: "Connected SparkLaunch SAFE modeling and closing tools"
      transport: "streamable_http"
      url: "https://sparklaun.ch/api/mcp/"
policy:
  allow_implicit_invocation: true
