interface:
  display_name: "SparkLaunch SparkRoom"
  short_description: "Prepare investor rooms and control document sharing"
  icon_small: "./assets/sparklaunch-small.png"
  icon_large: "./assets/sparklaunch.png"
  brand_color: "#6366F1"
  default_prompt: "Use $sparklaunch-sparkroom to prepare an investor room and review its sharing controls."
dependencies:
  tools:
    - type: "mcp"
      value: "sparklaunch"
      description: "Connected SparkLaunch investor-room tools"
      transport: "streamable_http"
      url: "https://sparklaun.ch/api/mcp/"
policy:
  allow_implicit_invocation: true
