interface:
  display_name: "SparkLaunch Projects"
  short_description: "List, create, inspect, and update projects"
  icon_small: "./assets/sparklaunch-small.svg"
  icon_large: "./assets/sparklaunch.png"
  brand_color: "#6366F1"
  default_prompt: "Use $sparklaunch-projects to list my connected SparkLaunch projects and help me select one."
dependencies:
  tools:
    - type: "mcp"
      value: "sparklaunch"
      description: "Connected SparkLaunch project tools"
      transport: "streamable_http"
      url: "https://sparklaun.ch/api/mcp/"
policy:
  allow_implicit_invocation: true
