name: Publish versioned plugin assets

on:
  workflow_dispatch:

concurrency:
  group: plugin-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  readiness:
    if: github.repository == 'SparkLaunch-Dev/SparkLaunch-Skills' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/release-readiness.yml
    secrets: inherit

  publish:
    needs: readiness
    if: github.repository == 'SparkLaunch-Dev/SparkLaunch-Skills' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: public-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build only the reviewed candidate's release assets
        run: |
          python scripts/build_release_bundles.py
          python scripts/build_submission_bundle.py
      - name: Revalidate evidence and production immediately before publication
        env:
          SPARKLAUNCH_MCP_ACCESS_TOKEN: ${{ secrets.SPARKLAUNCH_MCP_ACCESS_TOKEN }}
        run: |
          python scripts/validate_portal_prerequisites.py
          python scripts/validate_public_release.py --live
      - name: Publish versioned archives and digests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(python -c 'from scripts.sync_plugin import _base_package_version; print(_base_package_version())')
          tag="${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "This release already exists; bump the package version instead of overwriting it."
            exit 1
          fi
          if ! gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${tag}" -f sha="$GITHUB_SHA" >/dev/null; then
            echo "The version tag already exists or could not be created at the reviewed commit."
            exit 1
          fi
          gh release create "$tag" --verify-tag --title "SparkLaunch plugins ${version}" \
            --notes-file submission/github-release-notes.md \
            dist/release/*.zip dist/release/release-manifest.json dist/release/SHA256SUMS
