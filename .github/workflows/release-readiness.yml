name: Verify public release readiness

on:
  workflow_call:
    secrets:
      SPARKLAUNCH_MCP_ACCESS_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'SparkLaunch-Dev/SparkLaunch-Skills' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: public-release
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Validate exact candidate source
        run: |
          python scripts/sync_plugin.py
          python scripts/generate_submission.py --check
          python scripts/validate_host_packages.py
          python scripts/validate_submission.py
          python scripts/build_release_bundles.py
          python scripts/build_submission_bundle.py
          python -m pytest -q
      - name: Require current deployment, reviewer, portal scan and demo evidence
        run: python scripts/validate_portal_prerequisites.py
      - name: Require native acceptance and fresh full production equality
        env:
          SPARKLAUNCH_MCP_ACCESS_TOKEN: ${{ secrets.SPARKLAUNCH_MCP_ACCESS_TOKEN }}
        run: python scripts/validate_public_release.py --live
