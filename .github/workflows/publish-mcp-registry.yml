name: Publish to MCP Registry

on:
  workflow_dispatch:

concurrency:
  group: mcp-registry-publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.repository == 'SparkLaunch-Dev/SparkLaunch-Skills'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the published manifest
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install the MCP Registry publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
        run: |
          set -euo pipefail
          release_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error \
            --output mcp-publisher_linux_amd64.tar.gz \
            "${release_url}/mcp-publisher_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            --output registry_checksums.txt \
            "${release_url}/registry_${MCP_PUBLISHER_VERSION#v}_checksums.txt"
          grep ' mcp-publisher_linux_amd64.tar.gz$' registry_checksums.txt \
            | sha256sum --check --strict -
          tar -xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher
          chmod +x mcp-publisher
          ./mcp-publisher --version

      - name: Validate the Registry manifest
        run: ./mcp-publisher validate server.json

      - name: Authenticate with the repository identity
        run: ./mcp-publisher login github-oidc

      - name: Publish SparkLaunch
        run: ./mcp-publisher publish server.json
