name: Publish to MCP Registry

on:
  workflow_dispatch:

concurrency:
  group: mcp-registry-publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  readiness:
    if: github.repository == 'SparkLaunch-Dev/SparkLaunch-Skills' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/release-readiness.yml
    secrets: inherit

  publish:
    needs: readiness
    if: github.repository == 'SparkLaunch-Dev/SparkLaunch-Skills' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: public-release

    steps:
      - name: Check out the published manifest
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Revalidate evidence and production immediately before publication
        env:
          SPARKLAUNCH_MCP_ACCESS_TOKEN: ${{ secrets.SPARKLAUNCH_MCP_ACCESS_TOKEN }}
        run: |
          python scripts/build_release_bundles.py
          python scripts/build_submission_bundle.py
          python scripts/validate_portal_prerequisites.py
          python scripts/validate_public_release.py --live

      - name: Install the MCP Registry publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
        run: |
          set -euo pipefail
          release_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error \
            --output mcp-publisher_linux_amd64.tar.gz \
            "${release_url}/mcp-publisher_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            --output registry_checksums.txt \
            "${release_url}/registry_${MCP_PUBLISHER_VERSION#v}_checksums.txt"
          grep ' mcp-publisher_linux_amd64.tar.gz$' registry_checksums.txt \
            | sha256sum --check --strict -
          tar -xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher
          chmod +x mcp-publisher
          ./mcp-publisher --version

      - name: Validate the Registry manifest
        run: ./mcp-publisher validate server.json

      - name: Authenticate with the repository identity
        run: ./mcp-publisher login github-oidc

      - name: Publish SparkLaunch
        run: ./mcp-publisher publish server.json
